<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Techzy • Smart Canteen</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#172b25;background:#f2f6f2}header{background:#123d30;color:white;padding:22px max(5vw,18px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #cbd9d0}button{background:#176b4d;color:white;cursor:pointer;border:0}button:disabled{opacity:.4;cursor:not-allowed}nav button,.secondary{background:#e3eee6;color:#174431}main{max-width:1100px;margin:auto;padding:24px 18px}.hero{background:#d9efdf;border-radius:24px;padding:35px;margin-bottom:24px}h1{font-size:clamp(28px,5vw,46px);margin:10px 0}h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.panel,.food{background:white;border:1px solid #dce5df;border-radius:18px;padding:20px;margin-bottom:16px}.emoji{font-size:60px;background:#f3f7ee;border-radius:12px;text-align:center;padding:18px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.muted{color:#587065}.token{font-size:36px;font-weight:800;color:#176b4d}.pill{background:#e0f2e5;padding:6px 12px;border-radius:20px;display:inline-block}dialog{border:0;border-radius:20px;padding:24px;max-width:90vw;width:440px}dialog::backdrop{background:#10251cb0}footer{text-align:center;color:#587065;padding:20px}input,select{max-width:100%}.bar{background:#176b4d;height:12px;border-radius:8px;min-width:0}small{display:block}  .steps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.steps span{font-size:12px;padding:7px 10px;border-radius:20px;background:#edf0ed;color:#627369}.steps .complete{background:#176b4d;color:white}header{position:sticky;top:0;z-index:2;box-shadow:0 5px 25px #123d3022}.hero{background:linear-gradient(135deg,#d9efdf,#f9f1d2);padding:clamp(22px,5vw,55px)}.food,.panel{box-shadow:0 8px 25px #123d3009}.food button{width:100%}button:hover:not(:disabled){filter:brightness(.94)}@media(max-width:600px){header{position:static}nav button{font-size:12px;padding:9px}main{padding:16px}.grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.food{padding:12px}.emoji{font-size:42px}.panel{padding:14px}} </style></head><body><header><strong>TECHZY / SMART CANTEEN</strong><nav><button onclick="view('home')">Home</button><button onclick="view('menu')">Menu</button><button onclick="view('account')">Student account</button><button onclick="view('cart')">Cart <span id="count"></span></button><button onclick="view('track')">My orders</button><button onclick="view('staff')">Staff demo</button><button onclick="view('serve')">Now serving</button><button onclick="view('analytics')">Analytics</button></nav></header><main id="app"></main><footer>Techzy • SW-10 Hackathon prototype • Local browser demo • Staff access is unrestricted • No real payments or emails</footer><dialog id="modal"></dialog><script>
const initial=[{id:1,name:'Veg Sandwich',price:45,icon:'🥪',available:true},{id:2,name:'Samosa',price:15,icon:'🥟',available:true},{id:3,name:'Masala Dosa',price:60,icon:'🥞',available:true},{id:4,name:'Veg Burger',price:55,icon:'🍔',available:true},{id:5,name:'Cold Coffee',price:50,icon:'🥤',available:true},{id:6,name:'Tea',price:10,icon:'☕',available:true}];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('techzy-'+k))??d}catch{return d}};const save=(k,v)=>localStorage.setItem('techzy-'+k,JSON.stringify(v));let menu=read('menu',initial),orders=read('orders',[]),cart=read('cart',{}),page='home';const app=document.getElementById('app'),modal=document.getElementById('modal');let student=read('student',null);const stages=['Received','Preparing','Ready','Collected'];const money=n=>'₹'+n;const total=()=>menu.reduce((s,m)=>s+m.price*(cart[m.id]||0),0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function view(p){page=p;render()}function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];save('cart',cart);render()}function render(){document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0);if(page==='home')app.innerHTML=`<section class="hero"><span class="pill">TECHZY • SW-10</span><h1>Skip the line.<br>Enjoy your break.</h1><p>Order ahead, get a digital token and pick up your food when it is ready.</p><button onclick="view('menu')">Explore menu →</button> <button class="secondary" onclick="view('track')">Track order</button></section><div class="grid"><div class="panel"><h2>01 · Order</h2>Choose your favourite food.</div><div class="panel"><h2>02 · Token</h2>Get your unique pickup number.</div><div class="panel"><h2>03 · Collect</h2>Track your order and collect at the counter.</div></div>`;if(page==='account')app.innerHTML=`<section class="panel"><h2>Student profile (local demo)</h2>${student?`<p>Signed in as ${esc(student.name)} · ${esc(student.email)}</p><button onclick="student=null;save('student',null);render()">Sign out</button>`:`<form onsubmit="event.preventDefault();student={name:this.elements.fullname.value,email:this.elements.email.value};save('student',student);view('menu')"><p><input name="fullname" placeholder="Full name" required></p><p><input name="email" type="email" placeholder="College email" required></p><button>Continue</button></form><p class="muted">Local profile only; no password or verified authentication.</p>`}</section>`;if(page==='menu')app.innerHTML=`<section class="hero"><span class="pill">SKIP THE QUEUE</span><h1>Good food. Less waiting.</h1><p>Pre-order your favourites and collect when your token is ready.</p></section><h2>Today's menu</h2><div class="grid">${menu.map(m=>`<article class="food"><div class="emoji">${m.icon}</div><h3>${esc(m.name)}</h3><div class="line"><strong>${money(m.price)}</strong><span class="muted">${m.available?'Available':'Sold out'}</span></div><button ${m.available?'':'disabled'} onclick="confirmAdd(${m.id})">Add to cart ${cart[m.id]?'('+cart[m.id]+')':''}</button></article>`).join('')}</div>`;if(page==='cart')app.innerHTML=`<h2>Your cart</h2><section class="panel">${menu.filter(m=>cart[m.id]).map(m=>`<div class="line"><strong>${esc(m.name)} ${money(m.price)} ${m.available?'':'(Sold out)'}</strong><div><button class="secondary" onclick="qty(${m.id},-1)">−</button> ${cart[m.id]} <button class="secondary" ${m.available?'':'disabled'} onclick="qty(${m.id},1)">+</button></div></div>`).join('')||'Your cart is empty.'}<hr><div class="line"><strong>Total ${money(total())}</strong><button ${total()?'':'disabled'} onclick="checkout()">Checkout</button></div></section>`;if(page==='track'||page==='staff'){app.innerHTML=`<h2>${page==='staff'?'Staff dashboard':'My orders'}</h2>${orders.filter(o=>page==='staff'||(student?o.email===student.email:!o.email)).slice().reverse().map(o=>`<section class="panel"><div class="line"><span class="token">${o.token}</span><span class="pill">${o.status}</span></div><p>${o.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</p><p>${money(o.total)} · ${o.payment}</p><p>${esc(o.customer||'Guest')}</p><div class="steps">${stages.map((x,i)=>`<span class="${i<=stages.indexOf(o.status)?'complete':''}">${x}</span>`).join('')}</div><p>${['Ready','Collected'].includes(o.status)?'Food '+o.status.toLowerCase():'Estimated wait: '+Math.max(5,(orders.filter(x=>x.id<o.id&&['Received','Preparing'].includes(x.status)).length+1)*5)+' min (demo estimate)'}</p>${page==='staff'&&o.status!=='Collected'?`<button onclick="advance(${o.id})">Mark ${stages[stages.indexOf(o.status)+1]}</button>`:''}</section>`).join('')||'<p>No orders yet.</p>'}${page==='staff'?`<h2>Menu management</h2><form class="panel" onsubmit="event.preventDefault();addFood(this)"><input name="foodname" placeholder="Food name" required><input name="price" type="number" min="1" placeholder="Price" required><button>Add food</button></form><div class="panel">${menu.map(m=>`<div class="line">${esc(m.name)}<button class="secondary" onclick="toggle(${m.id})">${m.available?'Mark sold out':'Mark available'}</button><button class="secondary" onclick="editFood(${m.id})">Edit</button><button class="secondary" onclick="removeFood(${m.id})">Remove</button></div>`).join('')}</div>`:''}`;}if(page==='serve')app.innerHTML=`<h2>Now serving</h2><div class="grid">${orders.filter(o=>o.status==='Ready').map(o=>`<div class="panel"><div class="token">${o.token}</div><p>Ready for pickup</p></div>`).join('')||'<p>No ready tokens.</p>'}</div>`;if(page==='analytics'){let today=orders.filter(o=>new Date(o.time).toDateString()===new Date().toDateString()),hours=Array(24).fill(0);today.forEach(o=>hours[new Date(o.time).getHours()]++);app.innerHTML=`<h2>Today's analytics</h2><div class="grid"><div class="panel">Orders<div class="token">${today.length}</div></div><div class="panel">Order value<div class="token">${money(today.reduce((s,o)=>s+o.total,0))}</div></div><div class="panel">Collected<div class="token">${today.filter(o=>o.status==='Collected').length}</div></div></div><section class="panel"><h3>Peak hours</h3>${hours.map((n,h)=>n?`<p>${h}:00 · ${n} orders</p><div class="bar" style="width:${n/Math.max(...hours)*100}%"></div>`:'').join('')||'No orders today.'}</section>`;}}
function confirmAdd(id){menu=read('menu',initial);const m=menu.find(x=>x.id===id);if(!m||!m.available){render();return}modal.innerHTML='<h2>Add to cart?</h2><p>'+esc(m.name)+' · '+money(m.price)+'</p><div class="line"><button class="secondary" onclick="modal.close()">Cancel</button><button onclick="addConfirmed('+id+')">Confirm add</button></div>';modal.showModal()}function addConfirmed(id){menu=read('menu',initial);if(menu.some(m=>m.id===id&&m.available))qty(id,1);modal.close();render()}function checkout(){menu=read('menu',initial);if(menu.some(m=>cart[m.id]&&!m.available)){alert('Some items are sold out. Remove them before checkout.');render();return}modal.innerHTML=`<h2>Checkout</h2><p>Total: <strong>${money(total())}</strong></p><label>Payment method<br><select id="pay"><option>Mock online payment</option><option>Mock payment failure</option><option>Pay at counter</option></select></label><p class="muted">Demo only. No real money is charged.</p><div class="line"><button class="secondary" onclick="modal.close()">Cancel</button><button onclick="place()">Confirm order</button></div>`;modal.showModal()}function place(){menu=read('menu',initial);orders=read('orders',[]);if(!total()||menu.some(m=>cart[m.id]&&!m.available)){modal.close();render();return}if(document.getElementById('pay').value==='Mock payment failure'){modal.innerHTML='<h2>Payment failed</h2><p>No order was placed. Your cart is retained.</p><button onclick="modal.close();checkout()">Retry</button> <button class="secondary" onclick="modal.close()">Cancel</button>';return}let id=Math.max(0,...orders.map(o=>o.id))+1;let o={id,customer:student?.name||'Guest',email:student?.email||null,token:'T-'+String(id).padStart(3,'0'),items:menu.filter(m=>cart[m.id]).map(m=>({name:m.name,qty:cart[m.id]})),total:total(),payment:document.getElementById('pay').value,status:'Received',time:Date.now()};orders.push(o);save('orders',orders);cart={};save('cart',cart);modal.innerHTML=`<h2>Order confirmed!</h2><div class="token">${o.token}</div><p>Keep this token for pickup.</p><button onclick="modal.close();view('track')">Track order</button>`;render()}function addFood(f){menu.push({id:Date.now(),name:f.elements.foodname.value.trim(),price:Number(f.elements.price.value),icon:'🍽️',available:true});save('menu',menu);render()}function editFood(id){let m=menu.find(x=>x.id===id);let name=prompt('Food name',m.name),price=prompt('Price',m.price);if(name?.trim()&&price!==null&&Number(price)>0){m.name=name.trim();m.price=Number(price);save('menu',menu);render()}}function removeFood(id){if(!confirm('Remove this item from the menu?'))return;menu=menu.filter(m=>m.id!==id);delete cart[id];save('menu',menu);save('cart',cart);render()}function advance(id){orders=read('orders',[]);let o=orders.find(o=>o.id===id);if(o&&o.status!=='Collected')o.status=stages[stages.indexOf(o.status)+1];save('orders',orders);render()}function toggle(id){menu=read('menu',initial);let m=menu.find(m=>m.id===id);m.available=!m.available;save('menu',menu);render()}window.addEventListener('storage',()=>{menu=read('menu',initial);orders=read('orders',[]);cart=read('cart',{});render()});render();</script></body></html>
