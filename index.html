<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TECHZY • Smart Canteen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#192d26;font:16px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#f5f7f2f2;backdrop-filter:blur(16px);border-bottom:1px solid #d9e6dd}nav{max-width:1150px;margin:auto;padding:14px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}.brand{font-size:23px;letter-spacing:-1px;font-weight:900;margin-right:auto}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#60776a}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;background:#17684d;color:#fff;font-weight:650;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.soft{background:#e3f0e6;color:#195b43}.ghost{background:white;color:#254b3b;border:1px solid #d9e6dd}main{max-width:1150px;margin:auto;padding:22px 15px 50px}.hero{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(125deg,#123e32,#1d8157);border-radius:25px;padding:35px;color:white;gap:12px}.hero h1{font-size:clamp(32px,5vw,60px);letter-spacing:-2px;line-height:1.06;margin:12px 0}.hero p{color:#ddf3e3}.hero .art{font-size:clamp(55px,12vw,135px)}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:14px}.card{background:#fff;border:1px solid #d9e6dd;border-radius:19px;padding:18px;box-shadow:0 4px 17px #183c2810}.food{font-size:62px;display:grid;place-items:center;height:115px;background:linear-gradient(145deg,#f2f4d9,#e1f1e5);border-radius:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.line{padding:12px 0;border-bottom:1px solid #dce7de}.muted{color:#60766a}.pill{background:#e3f0e6;color:#195b43;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}.token{font-weight:900;font-size:32px;color:#17684d}.price{font-size:24px;font-weight:800}h2,h3,p{margin:0 0 10px}.narrow{max-width:430px;margin:30px auto}input,select{width:100%;border:1px solid #c9d9cd;border-radius:11px;padding:12px;background:white}label{display:block;margin:12px 0 5px}.steps{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.step{padding:5px 8px;font-size:12px;background:#edf1ed;border-radius:8px}.done{background:#d4efdd;color:#145e3f}.current{background:#17684d;color:white}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.bar{flex:1;min-height:2px;background:#238b63;border-radius:4px 4px 0 0}.bars{display:flex;height:120px;align-items:end;gap:3px;border-bottom:1px solid #dce7de;margin:15px 0}.serving{background:#163d30;color:white;border-radius:22px;text-align:center;padding:35px;min-height:330px}.serving .token{padding:20px;background:#d7f9e1;border-radius:15px;font-size:clamp(34px,6vw,65px)}dialog{border:1px solid #dce7de;border-radius:20px;width:min(92vw,420px);padding:24px;color:#192d26}dialog::backdrop{background:#142e25aa;backdrop-filter:blur(4px)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#132e24;color:white;padding:12px 20px;border-radius:10px;max-width:90vw;z-index:5;display:none}footer{text-align:center;color:#60766a;padding:20px;font-size:12px}.alert{background:#fff2d4;padding:12px;border-radius:10px;margin:12px 0}button:focus-visible,input:focus{outline:3px solid #7bc99d;outline-offset:2px}@media(max-width:600px){.brand{flex-basis:100%}nav button{font-size:12px;padding:8px}.hero{padding:23px 15px}.card{padding:14px}}
</style></head><body>
<header><nav><div class="brand">TECHZY<span style="color:#26976b">.</span><small>SMART CANTEEN</small></div><button class="ghost" onclick="go('menu')">Menu</button><button class="ghost" onclick="go('orders')">My orders</button><button class="ghost" onclick="go('serving')">Now serving</button><button id="staffNav" class="ghost" hidden onclick="go('staff')">Staff</button><button id="cartNav" onclick="go('cart')">Cart (0)</button><button id="authNav" class="soft" onclick="go('login')">Sign in</button></nav></header><main id="app">Loading…</main><footer>TECHZY • OVERCLOCK 26 • SW-10 • Mock payments only</footer><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id), app=$("app"), modal=$("modal"), stages=["Received","Preparing","Ready","Collected"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), money=n=>"₹"+Number(n).toLocaleString("en-IN");
let user=null,menu=[],cart={},page="menu",wait=0,busy=false,requestId=null,seq=0,timer;
function toast(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(timer);timer=setTimeout(()=>$("toast").style.display="none",3500)}
async function api(p,d){let r=await fetch("/api/"+p,d===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});let j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
function nav(){$("cartNav").textContent="Cart ("+Object.values(cart).reduce((a,b)=>a+b,0)+")";$("staffNav").hidden=user?.role!=="staff";$("authNav").textContent=user?"Sign out":"Sign in";$("authNav").onclick=user?logout:()=>go("login")}
function show(h){app.innerHTML=h;nav()}
function go(p){page=p;render();window.scrollTo(0,0)}
function dlg(h){modal.innerHTML=h;if(!modal.open)modal.showModal()}
function closeD(){modal.close()}
async function logout(){try{await api("logout",{});user=null;cart={};requestId=null;go("menu")}catch(e){toast(e.message)}}
function menuCards(){let q=($("search")?.value||"").toLowerCase(),cat=$("category")?.value||"All";$("foods").innerHTML=menu.filter(m=>m.name.toLowerCase().includes(q)&&(cat==="All"||m.category===cat)).map(m=>'<article class="card"><div class="food">'+esc(m.emoji)+'</div><div class="row" style="margin-top:12px"><span class="pill">'+esc(m.category)+'</span><small class="muted">'+(m.stock?m.stock+" left":"Sold out")+'</small></div><h3 style="margin-top:9px">'+esc(m.name)+'</h3><div class="row"><span class="price">'+money(m.price)+'</span><button '+(m.stock?"":"disabled")+' onclick="ask('+m.id+')">+ Add</button></div><small class="muted">'+m.minutes+' min prep</small></article>').join("")||"<p>No matching foods.</p>"}
function ask(id){let m=menu.find(x=>x.id===id);if(!m||m.stock<=(cart[id]||0))return toast("Insufficient stock");dlg('<div class="food">'+esc(m.emoji)+'</div><h2>Add '+esc(m.name)+'?</h2><p>'+money(m.price)+' per portion</p><div class="row"><button class="ghost" onclick="closeD()">Cancel</button><button onclick="add('+id+')">Confirm add</button></div>')}
function add(id){let m=menu.find(x=>x.id===id);if(!m||Math.min(20,m.stock)<=(cart[id]||0))return toast("Quantity unavailable");cart[id]=(cart[id]||0)+1;requestId=null;closeD();nav();toast("Added to cart")}
function qty(id,d){let m=menu.find(x=>x.id===id),n=(cart[id]||0)+d;if(d>0&&n>Math.min(20,m.stock))return toast("Insufficient stock");if(n<=0)delete cart[id];else cart[id]=n;requestId=null;render()}
function total(){return menu.reduce((s,m)=>s+m.price*(cart[m.id]||0),0)}
function checkout(){if(!user){toast("Sign in first");return go("login")}if(user.role!=="student")return toast("Student account required");let p=$("payment").value;dlg('<h2>'+ (p==="mock"?"Mock payment":"Pay at counter")+'</h2><div class="price">'+money(total())+'</div><p class="muted">No real online payment is processed.</p><div class="row"><button class="ghost" onclick="closeD()">Cancel</button>'+(p==="mock"?'<button class="ghost" onclick="closeD();toast(\'Mock payment failed; cart retained\')">Simulate failure</button>':'')+'<button onclick="place(\''+p+'\')">Confirm '+(p==="mock"?"payment":"order")+'</button></div>')}
async function place(p){if(busy)return;busy=true;modal.querySelectorAll("button").forEach(b=>b.disabled=true);try{requestId=requestId||Date.now()+"-"+Math.random().toString(36).slice(2);let o=await api("order",{cart,payment:p,request_id:requestId});cart={};requestId=null;closeD();go("orders");dlg('<span class="pill">ORDER CONFIRMED</span><h2>Digital token</h2><div class="token">'+esc(o.token)+'</div><p>Collect your food when ready.</p><button onclick="closeD()">Track order</button>')}catch(e){closeD();toast(e.message);render()}finally{busy=false}}
function order(o,staff=false){let next=stages[stages.indexOf(o.status)+1];return '<div class="card"><div class="row"><span class="token">'+esc(o.token)+'</span><span class="pill">'+esc(o.status)+'</span></div><p class="muted">'+esc(o.created.slice(0,16).replace("T"," "))+(staff?" · "+esc(o.student):"")+'</p><p>'+o.items.map(i=>esc(i.name)+" × "+i.qty).join(" · ")+'</p><div class="row"><b>'+money(o.total)+'</b><span class="muted">'+(o.payment==="mock"?"Mock paid":o.paid?"Counter paid":"Cash due")+'</span></div><div class="steps">'+stages.map((s,i)=>'<span class="step '+(i===stages.indexOf(o.status)?"current":i<stages.indexOf(o.status)?"done":"")+'">'+s+'</span>').join("")+'</div>'+(staff?'<div class="row">'+(!o.paid?'<button class="soft" onclick="change(\'paid\','+o.id+')">Record cash</button>':'')+(next?'<button '+(next==="Collected"&&!o.paid?"disabled":"")+' onclick="change(\'status\','+o.id+',\''+next+'\')">Mark '+next+'</button>':'')+'</div>':'<p class="muted">'+(o.status==="Ready"?"Ready for pickup":o.status==="Collected"?"Collected":"Estimated wait: "+o.wait+" min")+'</p>')+'</div>'}
async function change(p,id,status){try{await api(p,{id,status});toast("Updated");render()}catch(e){toast(e.message)}}
async function stock(id){let v=prompt("Available portions",menu.find(m=>m.id===id).stock);if(v===null)return;if(!/^\d+$/.test(v))return toast("Enter whole number");try{await api("stock",{id,stock:Number(v)});render()}catch(e){toast(e.message)}}
async function render(refresh=false){let p=page,g=++seq,valid=()=>g===seq&&p===page;try{
if(p==="login"||p==="signup"){let s=p==="signup";show('<div class="card narrow"><h2>'+(s?"Create student account":"Sign in")+'</h2><p class="muted">Email + password. No OTP.</p><form id="form">'+(s?'<label for="name">Full name</label><input id="name" required maxlength="80">':'')+'<label for="email">Email</label><input id="email" type="email" required><label for="password">Password</label><input id="password" type="password" required minlength="'+(s?8:1)+'" maxlength="128"><p id="err" style="color:#9c2929"></p><button>Continue</button></form><p style="margin-top:15px"><button class="soft" onclick="go(\''+(s?"login":"signup")+'\')">'+(s?"Already registered? Sign in":"New student? Register")+'</button></p></div>');$("form").onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector("button");b.disabled=true;try{user=(await api(p,{name:$("name")?.value,email:$("email").value,password:$("password").value})).user;go(user.role==="staff"?"staff":Object.keys(cart).length?"cart":"menu")}catch(e){$("err").textContent=e.message;b.disabled=false}};return}
if((p==="orders"||p==="staff")&&!user){page="login";return render()}
if(p==="menu"||p==="cart"){let m=await api("menu");if(!valid())return;menu=m.menu;wait=m.wait;if(p==="menu"){show('<div class="hero"><div><span class="pill">NO QUEUES · CAMPUS FOOD</span><h1>Good food.<br>Less waiting.</h1><p>Order ahead. Get your digital token. Collect when ready.</p><b>Current queue estimate: '+wait+' min</b></div><div class="art">🍱</div></div><div class="section"><h2>Explore the menu</h2><div style="min-width:180px"><input id="search" placeholder="Search food" aria-label="Search food"></div><div><select id="category" aria-label="Category">'+["All",...new Set(menu.map(m=>m.category))].map(c=>'<option>'+esc(c)+'</option>').join("")+'</select></div></div><div id="foods" class="grid"></div>');$("search").oninput=menuCards;$("category").onchange=menuCards;menuCards()}else{let items=menu.filter(m=>cart[m.id]);show('<div class="section"><h2>Your cart</h2><button class="soft" onclick="go(\'menu\')">Add more food</button></div><div class="card">'+(items.length?items.map(m=>'<div class="line row"><b>'+esc(m.name)+'</b><div><button class="soft" onclick="qty('+m.id+',-1)">−</button> '+cart[m.id]+' <button class="soft" onclick="qty('+m.id+',1)">+</button></div><b>'+money(m.price*cart[m.id])+'</b></div>').join("")+'<div class="line row"><b>Total</b><span class="price">'+money(total())+'</span></div><label for="payment">Payment method</label><select id="payment"><option value="mock">Mock online payment</option><option value="counter">Cash / pay at counter</option></select><div class="alert">Demo only. No real money or card details.</div><button onclick="checkout()">Checkout</button>':"<p>Cart is empty.</p>")+'</div>')}return}
if(p==="orders"){let [o,n]=await Promise.all([api("orders"),api("notices")]);if(!valid())return;show('<div class="section"><h2>My orders</h2><span class="pill">Live · 3 sec</span></div><div class="grid">'+(o.map(x=>order(x)).join("")||"<p>No orders yet.</p>")+'</div><div class="section"><h2>Notifications</h2></div><div class="card">'+(n.map(x=>'<div class="line">'+esc(x.body)+'</div>').join("")||"<p>No notifications yet.</p>")+'</div>');return}
if(p==="serving"){let r=await api("serving");if(!valid())return;show('<div class="serving"><span class="pill">LIVE COUNTER</span><h1>Now serving</h1><p>Collect your order when your token appears.</p><div class="grid">'+(r.map(x=>'<div class="token">'+esc(x.token)+'</div>').join("")||"<p>No ready orders.</p>")+'</div></div>');return}
if(p==="staff"){let [d,m]=await Promise.all([api("staff"),api("menu")]);if(!valid())return;menu=m.menu;let max=Math.max(1,...d.stats.hours),peak=d.stats.orders?String(d.stats.hours.indexOf(max)).padStart(2,"0")+":00":"—";show('<div class="section"><h2>Staff dashboard</h2><span class="pill">Live orders</span></div><div class="stats">'+[["Today orders",d.stats.orders],["Paid sales (demo)",money(d.stats.sales)],["Cash due",money(d.stats.unpaid)],["Queue estimate",d.wait+" min"]].map(a=>'<div class="card"><span class="muted">'+a[0]+'</span><div class="price">'+a[1]+'</div></div>').join("")+'</div><div class="card" style="margin-top:14px"><h3>Peak-hour analytics</h3><p>Busiest hour: '+peak+'</p><div class="bars">'+d.stats.hours.map((n,i)=>'<div class="bar" style="height:'+(n/max*100)+'%" title="'+i+':00 · '+n+' orders"></div>').join("")+'</div><div class="row muted"><small>00:00</small><small>12:00</small><small>23:00</small></div></div><div class="section"><h2>Incoming & historical orders</h2></div><div class="grid">'+(d.orders.sort((a,b)=>(a.status==="Collected")-(b.status==="Collected")||a.id-b.id).map(x=>order(x,true)).join("")||"<p>No orders yet.</p>")+'</div><div class="section"><h2>Food availability</h2></div><div class="card">'+menu.map(x=>'<div class="line row"><b>'+esc(x.name)+'</b><span>'+x.stock+' available</span><button class="soft" onclick="stock('+x.id+')">Edit stock</button></div>').join("")+'</div>');return}
}catch(e){if(valid()&&!refresh)show('<div class="card"><h2>Unable to load</h2><p>'+esc(e.message)+'</p><button onclick="render()">Retry</button></div>')}}
(async()=>{try{user=(await api("me")).user;if(user?.role==="staff")page="staff";render()}catch(e){show("<div class='card'>Start server.py and open http://localhost:8000. This app requires its backend.</div>")}})();
setInterval(()=>{if(!document.hidden&&!modal.open&&!busy&&["orders","staff","serving"].includes(page))render(true)},3000);
</script></body></html>
